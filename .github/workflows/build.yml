
name: Windows VST3 build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Verify VST3 exists
        shell: pwsh
        run: |
          $p = "build/CLIPPER_artefacts/Release/VST3/CLIPPER.vst3"
          if (-not (Test-Path $p)) { Write-Error "No se generó $p"; exit 1 }
          Get-ChildItem -Recurse $p | Select-Object FullName, Length

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: CLIPPER-vst3-win-x64
          path: build/CLIPPER_artefacts/Release/VST3/CLIPPER.vst3
          if-no-files-found: error
